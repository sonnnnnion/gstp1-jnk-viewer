<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GSTP1–JNK · Research Viewer</title>
<style>
:root{
  --panel:#fff; --panel-2:#f4f7fc; --bg:#f2f5fa; --border:#dbe3ee; --border-strong:#bcc8d9;
  --text:#101a2e; --text-dim:#3a4762; --text-mute:#62708a;
  --accent:#2f5cd8; --accent-soft:rgba(47,92,216,.1);
  --good:#15803d; --warn:#b45309; --bad:#b91c1c;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(15,30,60,.05),0 8px 24px rgba(15,30,60,.06);
  --viewer-bg:#0d1424;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --panel:#141c2c; --panel-2:#1b2436; --bg:#0d1424; --border:#27324a;
    --border-strong:#3a475f; --text:#eef2f9; --text-dim:#c2ccdd; --text-mute:#8c9ab3;
    --accent:#7d9bff; --accent-soft:rgba(125,155,255,.14);
    --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 56px}
/* Grid children default to min-width:auto, so a nowrap construct name forces
   its column wider than the phone and the whole page scrolls sideways. Every
   grid track here is allowed to shrink instead. */
.stats>*,.arc>*,.row>*,.grid2>*,.kv>*{min-width:0}
h1,.sub,.byline,.q,.note,.stat span{overflow-wrap:anywhere}

/* ---- header + nav ---- */
header{padding:26px 0 14px}
h1{font-size:clamp(20px,4.4vw,29px);font-weight:780;letter-spacing:-.02em;line-height:1.22}
.sub{font-size:clamp(13px,3vw,15.5px);color:var(--text-mute);margin-top:5px}
.byline{font-size:12.5px;color:var(--text-mute);margin-top:9px;line-height:1.45}
nav{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:9px 0 11px;margin-bottom:16px;
  border-bottom:1px solid var(--border);
  display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;font:inherit;font-size:14px;font-weight:660;cursor:pointer;
  padding:9px 15px;border-radius:999px;border:1px solid var(--border);
  background:var(--panel);color:var(--text-dim);white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
nav button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---- cards ---- */
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 18px 16px;box-shadow:var(--shadow);margin-bottom:14px;
}
.card h2{font-size:clamp(16px,3.4vw,19px);font-weight:740;letter-spacing:-.015em}
.card h3{font-size:14.5px;font-weight:720;letter-spacing:-.01em}
.q{
  font-size:13.5px;color:var(--text-mute);line-height:1.45;margin-top:5px;
  border-left:3px solid var(--border-strong);padding-left:9px;
}
.muted{color:var(--text-mute)}
.small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:820px){.grid2{grid-template-columns:1fr 1fr}}

/* ---- stat tiles ---- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px}
.stat b{display:block;font-size:clamp(19px,5vw,25px);font-weight:780;letter-spacing:-.02em;line-height:1.15}
.stat span{display:block;font-size:11.5px;color:var(--text-mute);margin-top:3px;line-height:1.35}

/* ---- arc ---- */
.arc{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(min-width:700px){.arc{grid-template-columns:repeat(4,1fr)}}
.arcstep{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:11px 12px;position:relative}
.arcstep i{font-size:10.5px;font-weight:800;color:var(--accent);letter-spacing:.08em;
  font-style:normal;text-transform:uppercase}
.arcstep b{display:block;font-size:14.5px;font-weight:720;margin-top:2px}
.arcstep span{display:block;font-size:11.5px;color:var(--text-mute);margin-top:3px}

/* ---- fold rows (identical language to the Workbench) ---- */
.rows{margin-top:12px}
.row{display:grid;grid-template-columns:11px 1fr 44px;align-items:center;gap:8px;
  padding:6px 4px;border-radius:8px}
.row.axis{padding-top:0;padding-bottom:2px}
@media(min-width:640px){
  .row{grid-template-columns:11px 190px 1fr 46px auto;gap:10px}
}
.dot{width:11px;height:11px;border-radius:50%}
.name{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0}
.track{position:relative;height:17px;border-radius:9px;background:var(--panel-2);
  border:1px solid var(--border);grid-column:1/-1}
@media(min-width:640px){.track{grid-column:auto}}
.track>i{position:absolute;top:0;bottom:0;border-radius:9px 0 0 9px;opacity:.36}
.track>.tick{position:absolute;top:0;bottom:0;width:1px;background:var(--border-strong);opacity:.5}
.pt{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;
  transform:translate(-50%,-50%);border:2.5px solid var(--panel);
  box-shadow:0 1px 4px rgba(15,30,60,.28)}
.thresh{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--good);
  opacity:.8;border-radius:1px}
.val{font-size:12.5px;font-weight:740;text-align:right;font-variant-numeric:tabular-nums}
.axisline{position:relative;height:14px;grid-column:1/-1}
@media(min-width:640px){.axisline{grid-column:3}}
.axisline span{position:absolute;transform:translateX(-50%);font-size:10px;font-weight:700;
  color:var(--text-mute);font-variant-numeric:tabular-nums}
.flags{display:flex;gap:4px;justify-content:flex-end;min-width:0}
@media(min-width:640px){.flags{min-width:74px}}
.pill{font-size:10px;font-weight:750;padding:2px 7px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.pill.warn{background:rgba(180,83,9,.13);color:var(--warn)}
.pill.ok{background:rgba(21,128,61,.13);color:var(--good)}
.pill.ref{background:var(--accent-soft);color:var(--accent)}

/* ---- selector ---- */
.sel{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.sel::-webkit-scrollbar{display:none}
.sel button{
  flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:660;cursor:pointer;
  padding:7px 12px;border-radius:999px;border:1px solid var(--border);
  background:var(--panel);color:var(--text-dim);white-space:nowrap;
  display:flex;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent;
}
.sel button[aria-pressed=true]{border-color:currentColor;background:var(--accent-soft)}
.sel button i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}

/* ---- 3D ---- */
.viewer{position:relative;background:var(--viewer-bg);border-radius:var(--radius-sm);
  overflow:hidden;touch-action:none;border:1px solid var(--border)}
.viewer canvas{display:block;width:100%;height:auto;cursor:grab}
.viewer canvas:active{cursor:grabbing}
.vhint{position:absolute;left:10px;bottom:9px;font-size:11px;color:rgba(255,255,255,.62);
  pointer-events:none}
.vlegend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:11.5px;
  color:var(--text-mute)}
.vlegend span{display:flex;align-items:center;gap:6px}
.vlegend i{width:16px;height:8px;border-radius:3px}
.modes{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.modes button{font:inherit;font-size:12px;font-weight:640;cursor:pointer;padding:6px 11px;
  border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text-dim)}
.modes button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---- kv ---- */
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 12px;margin-top:11px;font-size:13px}
.kv dt{color:var(--text-mute)}
.kv dd{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block;margin-top:4px;overflow:visible}
.note{font-size:11.5px;color:var(--text-mute);margin-top:9px;line-height:1.45}
footer{padding:22px 0 8px;font-size:11.5px;color:var(--text-mute);line-height:1.55;
  border-top:1px solid var(--border);margin-top:20px}
.hide{display:none!important}
</style></head>

<script>
"use strict";
const D = JSON.parse(document.getElementById('DATA').textContent);
const CS = D.constructs, META = D.meta;
const MD = CS.filter(c => c.md);
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
const esc = (s) => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const num = (v, d = 2) => (v == null ? '—' : Number(v).toFixed(d));

document.getElementById('ttl').textContent = META.title;
document.getElementById('sub').textContent = META.subtitle;
document.getElementById('by').innerHTML =
  esc(META.author) + '<br>' + esc(META.affil) + '<br>' + esc(META.lab);
document.getElementById('foot').innerHTML =
  'Companion page to the conference poster. All values are produced by the ' +
  'project’s own analysis pipeline; nothing on this page is re-derived here.<br>' +
  esc(META.md_note);

/* ---------- shared row chart, the Workbench’s fold/ipTM language ---------- */
function rowChart({title, q, lo, hi, ticks, get, fmt, dec, thresh, flag, key}) {
  const tickEls = ticks.map(t =>
    `<span style="left:${((t - lo) / (hi - lo)) * 100}%">${fmt ? fmt(t) : t}</span>`).join('');
  const gl = ticks.map(t =>
    `<i class="tick" style="left:${((t - lo) / (hi - lo)) * 100}%"></i>`).join('');
  const rows = CS.map(c => {
    const v = get(c);
    const pct = v == null ? 0 : Math.max(0, Math.min(100, ((v - lo) / (hi - lo)) * 100));
    const bar = thresh == null
      ? `<i style="left:0;width:${pct}%;background:${c.color}"></i>` : '';
    const th = thresh != null
      ? `<i class="thresh" style="left:${((thresh - lo) / (hi - lo)) * 100}%"></i>` : '';
    return `<div class="row">
      <span class="dot" style="background:${c.color}"></span>
      <span class="name">${esc(c.short)}</span>
      <span class="track">${gl}${bar}${th}${v == null ? '' :
        `<span class="pt" style="left:${pct}%;background:${c.color}"></span>`}</span>
      <span class="val">${v == null ? '—' : num(v, dec)}</span>
      <span class="flags">${flag ? flag(c) : ''}</span></div>`;
  }).join('');
  return `<section class="card"><h2>${esc(title)}</h2><p class="q">${q}</p>
    <div class="rows"><div class="row axis"><span></span><span></span>
      <span class="axisline">${tickEls}</span><span></span><span class="flags"></span></div>
      ${rows}</div>
    <p class="note">${key}</p></section>`;
}

/* --------------------------------- overview -------------------------------- */
function overview() {
  const folded = CS.filter(c => c.plddt != null && c.plddt >= 80).length;
  const best = Math.max(...CS.map(c => c.pair_iptm ?? 0));
  const minis = CS.filter(c => c.kind === 'mini').length;
  const arc = [
    ['1', 'Predict', 'AlphaFold 3 folds of every construct, alone and with GSTP1'],
    ['2', 'Analyse', 'Confidence and interface metrics read per chain pair'],
    ['3', 'Design', `${minis} mini-constructs spliced from two JNK segments`],
    ['4', 'Validate', `Explicit-solvent MD, ${MD.length} constructs × 4 replicas`],
  ].map(([n, t, s]) =>
    `<div class="arcstep"><i>Step ${n}</i><b>${t}</b><span>${esc(s)}</span></div>`).join('');

  return `
  <section class="card">
    <div class="stats">
      <div class="stat"><b>${minis}</b><span>mini-constructs designed</span></div>
      <div class="stat"><b>${folded}/${CS.length}</b><span>fold confidently (pLDDT &ge; 80)</span></div>
      <div class="stat"><b>${num(best, 2)}</b><span>best JNK&harr;GSTP1 pair ipTM</span></div>
      <div class="stat"><b>${MD.length}&times;4</b><span>MD replicas, 5 ns each</span></div>
    </div>
    <div class="arc" style="margin-top:12px">${arc}</div>
  </section>

  <div class="grid2">
  ${rowChart({
    title: 'Do the constructs fold?', q: 'Mean pLDDT, folded alone. Higher is a more confident backbone.',
    lo: 83.5, hi: 90, ticks: [84, 86, 88, 90], get: c => c.plddt, dec: 1,
    flag: c => (c.disordered > 0
      ? `<span class="pill warn">${(c.disordered * 100).toFixed(0)}% disordered</span>` : ''),
    key: `All ${CS.length} above 80. ${CS.filter(c => !c.disordered).length}/${CS.length} with no disorder, none with clashes.`,
  })}
  ${rowChart({
    title: 'Does GSTP1 bind them?', q: esc(META.iptm_note),
    lo: 0, hi: 0.8, ticks: [0, 0.2, 0.4, 0.6], fmt: t => t.toFixed(1),
    get: c => c.pair_iptm, dec: 2, thresh: 0.6,
    key: `Line at 0.60, the level usually treated as trustworthy. The best value here is ${num(best, 2)} — none of these predictions supports binding.`,
  })}
  </div>

  <section class="card">
    <h2>What the poster concludes</h2>
    <ol style="margin:10px 0 0 18px;font-size:13.5px;line-height:1.65">
      <li>The mini-constructs keep high-confidence AlphaFold folds.</li>
      <li>GSTP1&ndash;JNK complex predictions stay low-confidence across every model tested.</li>
      <li>Short MD trajectories support local structural stability &mdash; not long-timescale convergence.</li>
    </ol>
    <p class="note"><b>Limitations.</b> AlphaFold confidence does not establish physical
      binding, and 5 ns assesses local stability rather than convergence. Predicted
      interfaces still require experimental validation.</p>
  </section>`;
}

/* ------------------------------- 3D CA trace -------------------------------
   A small purpose-built renderer rather than a bundled molecular-graphics
   library: the page has to be one offline file, and all it needs to draw is a
   backbone trace that can be turned. Painter's algorithm on depth-sorted
   segments is enough for a C-alpha trace and runs fine on a phone. */
const RAINBOW = ['#2563eb', '#0d9488', '#65a30d', '#d97706', '#dc2626'];
function lerpHex(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [r1, g1, b1] = p(a), [r2, g2, b2] = p(b);
  const c = (x, y) => Math.round(x + (y - x) * t).toString(16).padStart(2, '0');
  return '#' + c(r1, r2) + c(g1, g2) + c(b1, b2);
}
function ramp(t) {
  const x = Math.max(0, Math.min(1, t)) * (RAINBOW.length - 1);
  const i = Math.min(RAINBOW.length - 2, Math.floor(x));
  return lerpHex(RAINBOW[i], RAINBOW[i + 1], x - i);
}

function makeViewer(canvas, cons, mode) {
  const ca = cons.ca || [];
  let rx = 0.4, ry = 0.6, drag = null, zoom = 1;
  const rmsf = cons.md ? cons.md.rmsf.map(r => r[1]) : null;
  const rmax = rmsf ? Math.max(...rmsf) : 1;
  const rmin = rmsf ? Math.min(...rmsf) : 0;

  function colorAt(i) {
    if (mode === 'flex' && rmsf) {
      const v = rmsf[Math.min(rmsf.length - 1, i)];
      return ramp((v - rmin) / ((rmax - rmin) || 1));
    }
    // region mode: which part of JNK this residue came from
    if (cons.seg1 && cons.seg2) {
      const l1 = cons.seg1[1] - cons.seg1[0] + 1;
      const lk = (cons.linker || '').length;
      const lead = 3;                       // SGS cloning leader, kept in the model
      if (i < lead) return '#94a3b8';
      if (i < lead + l1) return '#2563eb';
      if (i < lead + l1 + lk) return '#ff2bd6';
      return '#0d9488';
    }
    return ramp(i / Math.max(1, ca.length - 1));
  }

  function draw() {
    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    const w = canvas.clientWidth, h = Math.round(w * 0.72);
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.height = h + 'px';
    const g = canvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    if (!ca.length) {
      g.fillStyle = 'rgba(255,255,255,.5)'; g.font = '13px -apple-system,sans-serif';
      g.textAlign = 'center';
      g.fillText('No structure embedded for this construct', w / 2, h / 2);
      return;
    }
    const cosY = Math.cos(ry), sinY = Math.sin(ry);
    const cosX = Math.cos(rx), sinX = Math.sin(rx);
    const pts = ca.map(p => {
      const x1 = p[0] * cosY - p[2] * sinY, z1 = p[0] * sinY + p[2] * cosY;
      const y1 = p[1] * cosX - z1 * sinX, z2 = p[1] * sinX + z1 * cosX;
      return [x1, y1, z2];
    });
    let ext = 1;
    for (const p of pts) ext = Math.max(ext, Math.abs(p[0]), Math.abs(p[1]));
    const s = (Math.min(w, h) * 0.44 / ext) * zoom;
    const P = pts.map(p => [w / 2 + p[0] * s, h / 2 - p[1] * s, p[2]]);
    const segs = [];
    for (let i = 0; i < P.length - 1; i++)
      segs.push({ i, z: (P[i][2] + P[i + 1][2]) / 2 });
    segs.sort((a, b) => a.z - b.z);           // far first
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (const sg of segs) {
      const i = sg.i, a = P[i], b = P[i + 1];
      const depth = (sg.z + ext) / (2 * ext);            // 0 far .. 1 near
      g.globalAlpha = 0.35 + 0.65 * depth;
      g.lineWidth = (1.6 + 3.4 * depth) * (zoom > 1 ? 1.1 : 1);
      g.strokeStyle = colorAt(i);
      g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
    }
    g.globalAlpha = 1;
  }

  function at(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  const down = e => { drag = at(e); };
  const move = e => {
    if (!drag) return;
    const p = at(e);
    ry += (p.x - drag.x) * 0.01; rx += (p.y - drag.y) * 0.01;
    rx = Math.max(-1.5, Math.min(1.5, rx));
    drag = p; draw(); e.preventDefault();
  };
  const up = () => { drag = null; };
  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', move, { passive: false });
  window.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  let auto = requestAnimationFrame(function spin() {
    if (!drag) { ry += 0.0035; draw(); }
    auto = requestAnimationFrame(spin);
  });
  const ro = new ResizeObserver(draw); ro.observe(canvas);
  draw();
  return { destroy() { cancelAnimationFrame(auto); ro.disconnect(); } };
}

/* ------------------------------- structures ------------------------------- */
let viewerHandle = null, structSel = 0, structMode = 'region';
function structures() {
  const c = CS[structSel];
  const pills = CS.map((x, i) =>
    `<button aria-pressed="${i === structSel}" data-si="${i}" style="color:${x.color}">
       <i style="background:${x.color}"></i>${esc(x.short)}</button>`).join('');
  const canFlex = !!c.md;
  const legend = structMode === 'flex' && canFlex
    ? `<span><i style="background:${ramp(0)}"></i>rigid</span>
       <span><i style="background:${ramp(.5)}"></i>&nbsp;</span>
       <span><i style="background:${ramp(1)}"></i>flexible</span>
       <span class="muted">per-residue RMSF over the MD run</span>`
    : (c.seg1 ? `<span><i style="background:#94a3b8"></i>cloning leader</span>
       <span><i style="background:#2563eb"></i>segment 1 (${c.seg1[0]}&ndash;${c.seg1[1]})</span>
       <span><i style="background:#ff2bd6"></i>linker ${esc(c.linker || '')}</span>
       <span><i style="background:#0d9488"></i>segment 2 (${c.seg2[0]}&ndash;${c.seg2[1]})</span>`
      : `<span><i style="background:${ramp(0)}"></i>N-terminus</span>
         <span><i style="background:${ramp(1)}"></i>C-terminus</span>`);

  const arch = c.seg1
    ? `<dt>Retained</dt><dd>${c.seg1[0]}&ndash;${c.seg1[1]}, ${c.seg2[0]}&ndash;${c.seg2[1]}</dd>
       <dt>Linker</dt><dd>${esc(c.linker || '—')}</dd>
       <dt>Removed</dt><dd>${c.deleted ? c.deleted[0] + '–' + c.deleted[1] : '—'}</dd>`
    : `<dt>Type</dt><dd>full-length reference</dd>`;

  return `
  <section class="card">
    <h2>Structures</h2>
    <p class="q">AlphaFold-designed constructs. Drag to turn the backbone; it spins on its own until you do.</p>
    <div class="sel" id="ssel">${pills}</div>
    <div class="viewer"><canvas id="cv"></canvas>
      <span class="vhint">drag to rotate</span></div>
    <div class="modes">
      <button data-mode="region" aria-pressed="${structMode === 'region'}">Regions</button>
      <button data-mode="flex" aria-pressed="${structMode === 'flex'}" ${canFlex ? '' : 'disabled'}>
        Flexibility</button>
    </div>
    <div class="vlegend">${legend}</div>
    <p class="note">C&alpha; backbone trace of the equilibrated structure.
      ${canFlex ? '' : 'No MD run has been analysed for this construct yet, so flexibility colouring is unavailable.'}</p>
  </section>

  <section class="card">
    <h2>${esc(c.short)}</h2>
    <p class="q">${esc(c.display_name || '')}</p>
    <dl class="kv">
      ${arch}
      <dt>Length</dt><dd>${c.length ?? '—'} aa</dd>
      <dt>Mean pLDDT (alone)</dt><dd>${num(c.plddt, 2)}</dd>
      <dt>pTM</dt><dd>${num(c.ptm, 2)}</dd>
      <dt>JNK&harr;GSTP1 pair ipTM</dt><dd>${num(c.pair_iptm, 2)}</dd>
      <dt>JNK pLDDT in complex</dt><dd>${num(c.jnk_plddt_in_complex, 1)}</dd>
    </dl>
    ${c.variant_note ? `<p class="note"><b>Note.</b> ${esc(c.variant_note)}</p>` : ''}
  </section>`;
}

/* ------------------------------- line charts ------------------------------- */
function lineChart(series, color, unit, {floor, ceil} = {}) {
  const W = 320, H = 150, ml = 40, mr = 8, mt = 8, mb = 26;
  const xs = series.map(p => p[0]), ys = series.map(p => p[1]);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.12 || 0.5;
  y0 -= pad; y1 += pad;
  if (floor != null) y0 = Math.max(y0, floor);
  if (ceil != null) y1 = Math.min(y1, ceil);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const px = t => ml + (t - x0) / ((x1 - x0) || 1) * (W - ml - mr);
  const py = v => mt + (1 - (v - y0) / ((y1 - y0) || 1)) * (H - mt - mb);
  let g = '';
  for (let i = 0; i <= 3; i++) {
    const v = y0 + (y1 - y0) * i / 3;
    g += `<line x1="${ml}" y1="${py(v).toFixed(1)}" x2="${W - mr}" y2="${py(v).toFixed(1)}"
          stroke="var(--border)" stroke-width=".7"/>
      <text x="${ml - 6}" y="${(py(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="9"
        fill="var(--text-mute)" font-weight="600">${v.toFixed(v > 20 ? 0 : 1)}</text>`;
  }
  for (let t = Math.ceil(x0); t <= x1; t++)
    g += `<text x="${px(t).toFixed(1)}" y="${H - mb + 14}" text-anchor="middle" font-size="9"
          fill="var(--text-mute)" font-weight="600">${t}</text>`;
  const pts = series.map(p => `${px(p[0]).toFixed(1)},${py(p[1]).toFixed(1)}`).join(' ');
  g += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6"
        stroke-linejoin="round"/>`;
  g += `<text x="${((ml + W - mr) / 2).toFixed(0)}" y="${H - 2}" text-anchor="middle"
        font-size="9" fill="var(--text-mute)" font-weight="600">time (ns)</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="${esc(unit)}">${g}</svg>`;
}

/* --------------------------------- MD tab --------------------------------- */
let mdSel = 0;
function mdTab() {
  const c = MD[mdSel], m = c.md, s = m.summary;
  const pills = MD.map((x, i) =>
    `<button aria-pressed="${i === mdSel}" data-mi="${i}" style="color:${x.color}">
       <i style="background:${x.color}"></i>${esc(x.short)}</button>`).join('');
  const rmsf = m.rmsf;
  const rmax = Math.max(...rmsf.map(r => r[1]));
  const bars = rmsf.map(([r, v]) =>
    `<rect x="${(r / rmsf.length * 100).toFixed(2)}%" y="${(100 - v / rmax * 100).toFixed(1)}%"
      width="${(100 / rmsf.length).toFixed(3)}%" height="${(v / rmax * 100).toFixed(1)}%"
      fill="${c.color}" opacity=".8"/>`).join('');
  return `
  <section class="card">
    <h2>Molecular dynamics</h2>
    <p class="q">${esc(META.md_note)}</p>
    <div class="sel" id="msel">${pills}</div>
    <div class="stats" style="margin-top:6px">
      <div class="stat"><b>${num(s.final_rmsd_a, 2)} Å</b><span>final backbone RMSD</span></div>
      <div class="stat"><b>${num(s.native_pct, 1)}%</b><span>native contacts retained</span></div>
      <div class="stat"><b>${num(Math.abs(s.rg_change_a), 2)} Å</b><span>|ΔR<sub>g</sub>| (compactness)</span></div>
      <div class="stat"><b>${m.n_replicas} × ${num(m.duration_ns, 0)} ns</b><span>replicas, explicit solvent</span></div>
    </div>
    <p class="note">${esc(m.method || '')}</p>
  </section>

  <div class="grid2">
    <section class="card"><h3>Backbone RMSD</h3>
      <p class="q">Å from the starting structure. A curve that rises then flattens is settling, not drifting.</p>
      ${lineChart(m.rmsd, c.color, 'backbone RMSD', {floor: 0})}</section>
    <section class="card"><h3>Radius of gyration</h3>
      <p class="q">Å. Overall compactness — a stable protein holds it.</p>
      ${lineChart(m.rg, c.color, 'radius of gyration')}</section>
    <section class="card"><h3>Native contacts</h3>
      <p class="q">% of the starting contacts still present.</p>
      ${lineChart(m.native, c.color, 'native contacts', {ceil: 100})}</section>
    <section class="card"><h3>Stability by region</h3>
      <p class="q">Per-residue RMSF. Tall bars are the floppy parts — usually the termini.</p>
      <svg class="chart" viewBox="0 0 100 40" preserveAspectRatio="none"
        style="height:150px;background:var(--panel-2);border-radius:8px">${bars}</svg>
      <p class="note">Residue 1 → ${rmsf.length}. Peak ${num(rmax, 2)} Å.</p></section>
  </div>`;
}

/* --------------------------------- router --------------------------------- */
let tab = 'overview';
function render() {
  if (viewerHandle) { viewerHandle.destroy(); viewerHandle = null; }
  const main = document.getElementById('main');
  main.innerHTML = tab === 'overview' ? overview()
                 : tab === 'structures' ? structures() : mdTab();
  if (tab === 'structures') {
    viewerHandle = makeViewer(document.getElementById('cv'), CS[structSel], structMode);
    main.querySelectorAll('#ssel button').forEach(b => b.onclick = () => {
      structSel = +b.dataset.si;
      if (!CS[structSel].md && structMode === 'flex') structMode = 'region';
      render();
    });
    main.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
      if (b.disabled) return; structMode = b.dataset.mode; render();
    });
  }
  if (tab === 'md') {
    main.querySelectorAll('#msel button').forEach(b => b.onclick = () => {
      mdSel = +b.dataset.mi; render();
    });
  }
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x =>
    x.setAttribute('aria-selected', String(x === b)));
  tab = b.dataset.tab; render();
});
render();

</script>
</body></html>
